# Auto-deploy to the production box on every push to main — the job Vercel
# used to do implicitly. INERT until Craig adds the two repository secrets
# below (Settings → Secrets and variables → Actions):
#
#   BOX_SSH_KEY   — private key with access to the deploy user on the box
#   BOX_SSH_HOST  — user@host, e.g. deploy@66.42.121.161
#
# "We have Tailscale, so why do we need these?" (Craig, 2026-08-04 — this
# keeps getting re-asked because Tailscale was documented NOWHERE in this repo
# until now). Tailscale solves REACHABILITY, not CI identity:
#
#   * Craig deploying from his own machine  → on the tailnet, no secrets needed.
#   * THIS workflow                          → a GitHub-hosted runner is an
#     ephemeral Azure VM with no tailnet membership. Tailscale alone cannot get
#     it to the box. It needs either public SSH creds (these secrets), or to
#     join the tailnet itself via tailscale/github-action + TS_OAUTH_CLIENT_ID
#     / TS_OAUTH_SECRET.
#
# Verified 2026-08-04: port 22 on 66.42.121.161 is open to the public internet
# (banner SSH-2.0-OpenSSH_8.9p1), so BOX_SSH_* works today with no Tailscale
# involvement. If public 22 is ever closed in favour of tailnet-only — which
# would be the better security posture given Tailscale already exists — this
# workflow breaks until the runner is joined to the tailnet.
#
# The box side just needs scripts/deploy/deploy-on-box.sh in the checkout
# (ships with the repo). Activation = Craig's call (Boss Rule: production
# deployment); the workflow skips cleanly while the secrets are absent.
name: Deploy to production box

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-box
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets present
        id: gate
        env:
          BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
          BOX_SSH_HOST: ${{ secrets.BOX_SSH_HOST }}
        run: |
          if [ -z "$BOX_SSH_KEY" ] || [ -z "$BOX_SSH_HOST" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            # Be LOUD about not deploying. This step used to print one plain
            # line and exit 0, so every push to main showed a green "Deploy to
            # production box / success" that had deployed nothing. Production
            # sat 60 commits behind for six days and nothing surfaced it
            # (found 2026-08-04). A silent skip that reports success is
            # exactly Forbidden #16.
            echo "::warning title=Deploy skipped — production NOT updated::BOX_SSH_KEY / BOX_SSH_HOST are not set, so this push did not reach production. Add them in Settings → Secrets and variables → Actions to enable auto-deploy."
            {
              echo "### ⚠️ Deploy skipped — production was NOT updated"
              echo
              echo "This run went green without deploying anything."
              echo
              echo "\`BOX_SSH_KEY\` / \`BOX_SSH_HOST\` are not configured, so the deploy step is inert."
              echo "Until Craig adds them (Settings → Secrets and variables → Actions), **every push to \`main\` leaves production on whatever commit was last deployed by hand.**"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.gate.outputs.enabled == 'true'
        env:
          BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
          BOX_SSH_HOST: ${{ secrets.BOX_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BOX_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "$BOX_SSH_HOST" \
            'bash "$(git -C "${GATETEST_APP_DIR:-$HOME/gatetest}" rev-parse --show-toplevel 2>/dev/null || echo "${GATETEST_APP_DIR:-$HOME/gatetest}")/scripts/deploy/deploy-on-box.sh"'

      - name: Verify live endpoints
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sleep 5
          status=$(curl -s --max-time 20 https://gatetest.io/api/status || true)
          echo "$status" | head -c 400
          echo "$status" | grep -q '"ready"' || { echo "::error::/api/status did not return JSON — deploy may not have taken"; exit 1; }

      # Needed only so the drift step below can count commits between the
      # deployed SHA and this one.
      - name: Checkout (for drift count)
        if: always()
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report production drift
        # Runs LAST and regardless of whether the deploy was enabled — after a
        # real deploy it confirms the new build actually took; when the deploy
        # is inert it puts a number on how far behind production has fallen.
        #
        # Never fails the build: this is a visibility mechanism, not a gate.
        # It exists because the skip path above reported green for six days
        # while production sat 60 commits stale, serving copy we had already
        # fixed (found 2026-08-04).
        if: always()
        continue-on-error: true
        run: |
          deployed=$(curl -s --max-time 20 https://gatetest.io/api/platform-status \
            | sed -n 's/.*"commit":"\([0-9a-f]\{7,40\}\)".*/\1/p')
          if [ -z "$deployed" ]; then
            echo "::warning title=Could not read deployed commit::/api/platform-status returned no commit field."
            exit 0
          fi
          echo "deployed=$deployed  head=$GITHUB_SHA"
          if [ "$deployed" = "$GITHUB_SHA" ]; then
            echo "✅ Production is current (\`$deployed\`)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          behind=$(git rev-list --count "$deployed..$GITHUB_SHA" 2>/dev/null || echo "unknown")
          echo "::warning title=Production is behind main::Deployed ${deployed} is ${behind} commit(s) behind ${GITHUB_SHA}. Customers — and any GitHub Marketplace reviewer — are seeing the older build."
          {
            echo "### 🚨 Production is ${behind} commit(s) behind \`main\`"
            echo
            echo "| | commit |"
            echo "|---|---|"
            echo "| deployed | \`${deployed}\` |"
            echo "| \`main\` | \`${GITHUB_SHA}\` |"
            echo
            echo "Public copy fixes do not reach customers until this is redeployed."
          } >> "$GITHUB_STEP_SUMMARY"
