name: Dogfood — Self-Scan Nightly

# Runs GateTest's own modules against the GateTest repo nightly. If we
# can't keep our own house clean, we can't sell the product. Each module
# here is the one a customer pays for; running them on ourselves makes
# every regression visible the next morning.

on:
  schedule:
    - cron: '15 3 * * *'   # 03:15 UTC, just after trainer-nightly
  workflow_dispatch:

permissions:
  contents: write          # site-stats PR branch push
  pull-requests: write
  issues: write

jobs:
  dogfood:
    name: Self-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # Without this, node_modules never exists in this job — modules that
        # need a real npm package (pngjs/pixelmatch for visualRegression +
        # crossBrowser) silently drop out of --list, dragging the module
        # count below the real 120 and feeding a wrong number into
        # site-stats.json / the public website (caught 2026-07-09: a nightly
        # run measured 118 modules + 8 spurious test failures this way).
        run: npm ci

      - name: Verify all modules load
        run: node bin/gatetest.js --list | wc -l

      - name: Run full test sweep
        run: |
          mkdir -p .dogfood
          node scripts/run-tests.js --timeout 60000 tests/*.test.js 2>&1 | tee .dogfood/sweep.log || true
          grep -E "^# (files|tests|pass|fail|cancelled|skipped)" .dogfood/sweep.log > .dogfood/sweep-summary.txt || true

      - name: Self-scan — full suite (measures "green on our own repo")
        # The hero's "N/N modules green" chip was CARRIED (greenSource:
        # "carried", greenMeasuredAt: null) since it was first typed — nothing
        # ever measured it (2026-08-18 audit). Run the full deterministic
        # engine on this repo and count modules that reported zero errors.
        # mutation/e2e/unitTests are CI-runner concerns already covered by the
        # sweep above and are skipped so the count is about the SCANNER.
        run: |
          GATETEST_NO_TELEMETRY=1 node bin/gatetest.js --suite full \
            --skip-module mutation --skip-module e2e --skip-module unitTests --skip-module dataIntegrity \
            > .dogfood/self-full.log 2>&1 || true
          node -e '
            const r = require("./.gatetest/reports/gatetest-report-latest.json");
            const mods = r.results || [];
            const scanned = mods.length;
            const green = mods.filter((m) => (m.checks || []).every((c) => c.passed || (c.severity || "error") !== "error")).length;
            require("fs").writeFileSync(".dogfood/self-green.env", "GREEN=" + green + "\nSCANNED=" + scanned + "\n");
            console.log("self-scan: " + green + "/" + scanned + " modules green");
          '
          cat .dogfood/self-green.env >> "$GITHUB_ENV"

      - name: Regenerate website testing statistics
        # Bridges continuous self-testing → the numbers shown on the site.
        # Reuses the sweep log just captured (no second suite run) and writes
        # website/app/data/site-stats.json. Displayed counts round DOWN, so
        # the public "N+" claim is always an under-statement. The next step
        # opens a PR if the JSON changed — Craig reviews before it ships.
        run: |
          node scripts/generate-site-stats.js --tap-log .dogfood/sweep.log \
            ${GREEN:+--green $GREEN} ${SCANNED:+--scanned $SCANNED}
          cp website/app/data/site-stats.json .dogfood/site-stats.json || true

      - name: Regenerate the public precision table
        # website/app/data/precision.json feeds /precision — blocking counts
        # from a full scan of pinned commits of repositories we do not
        # control (reliability-corpus/real-world.json). Same contract as
        # site-stats.json: written by the script from its own measurement,
        # never typed. The script refuses to write if any repo could not be
        # measured or any ceiling/floor was breached, and exits non-zero so
        # the regression is VISIBLE here (Forbidden #16) — the PR step below
        # then ships only what did change. No `|| true`: a red corpus is a
        # red step.
        run: |
          # --ratchet (the Fifty, move 06): a fully-green run lowers every
          # ceiling above its count to that count — never raises one, never
          # touches a floor — and the manifest rides the rolling PR below,
          # so a human still names each drop before it merges.
          GATETEST_NO_TELEMETRY=1 node scripts/real-world-precision.js \
            --ratchet --write-json website/app/data/precision.json
          cp website/app/data/precision.json .dogfood/precision.json || true

      - name: Regenerate the public changelog
        # website/app/data/changelog.json feeds /changelog — the main branch's
        # first-parent history (PR, date, areas, modules touched, version).
        # Same contract as the two files above: written by the script from
        # the repository, never typed. fetch-depth is 0 on this job, so the
        # history is complete.
        run: node scripts/generate-changelog.js --ref origin/main

      - name: Self-scan — dependencies module
        run: |
          mkdir -p .dogfood
          node bin/gatetest.js --module dependencies --json > .dogfood/dependencies.json 2>&1 || true
          echo "## Dependencies" > .dogfood/report.md
          jq -r '.checks // [] | length as $n | "\($n) checks"' .dogfood/dependencies.json >> .dogfood/report.md 2>/dev/null || true

      - name: Self-scan — secrets module
        run: |
          node bin/gatetest.js --module secrets --json > .dogfood/secrets.json 2>&1 || true
          echo "## Secrets" >> .dogfood/report.md
          jq -r '.checks // [] | length as $n | "\($n) checks"' .dogfood/secrets.json >> .dogfood/report.md 2>/dev/null || true

      - name: Self-scan — secret rotation module
        run: |
          node bin/gatetest.js --module secretRotation --json > .dogfood/secret-rotation.json 2>&1 || true
          echo "## Secret rotation" >> .dogfood/report.md
          jq -r '.checks // [] | length as $n | "\($n) checks"' .dogfood/secret-rotation.json >> .dogfood/report.md 2>/dev/null || true

      - name: Self-scan — TypeScript strictness
        run: |
          node bin/gatetest.js --module typescriptStrictness --json > .dogfood/ts-strictness.json 2>&1 || true
          echo "## TypeScript strictness" >> .dogfood/report.md
          jq -r '.checks // [] | length as $n | "\($n) checks"' .dogfood/ts-strictness.json >> .dogfood/report.md 2>/dev/null || true

      - name: Self-scan — log PII
        run: |
          node bin/gatetest.js --module logPii --json > .dogfood/log-pii.json 2>&1 || true
          echo "## Log PII" >> .dogfood/report.md
          jq -r '.checks // [] | length as $n | "\($n) checks"' .dogfood/log-pii.json >> .dogfood/report.md 2>/dev/null || true

      - name: Upload dogfood artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-${{ github.run_id }}
          path: .dogfood/
          retention-days: 60

      - name: Open issue if dependencies module flags errors
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ERR_COUNT=$(jq -r '[.checks[]? | select(.severity=="error")] | length' .dogfood/dependencies.json 2>/dev/null)
          if [ -n "$ERR_COUNT" ] && [ "$ERR_COUNT" -gt 0 ]; then
            TITLE="Dogfood: $ERR_COUNT dependency error(s) in self-scan ($(date -u +%Y-%m-%d))"
            BODY=$(printf '%s\n\nFull artifact: see %s actions run.' \
              "Self-scan flagged $ERR_COUNT error-severity finding(s) in our own dependencies." \
              "${{ github.run_id }}")
            # gh fails harmlessly if an open issue with same title already exists.
            gh issue list --label dogfood --search "$TITLE in:title" --limit 1 --state open --json title \
              | jq -e 'length == 0' && gh issue create \
                --title "$TITLE" --body "$BODY" --label dogfood,security \
              || echo "issue exists or gh unavailable — skipping"
          fi

      - name: Marketing-claim verification
        # Runs tests/heavy/marketing-claim-verification.test.js nightly to catch
        # drift between public-facing claims and the actual shipped code.
        # Examples caught: module count in Hero.tsx doesn't match --list output,
        # model name in copy doesn't match source, pricing tier missing from checkout.
        # CI already runs this on every PR (ci.yml's heavy-tests job); this nightly
        # run catches post-merge drift (e.g. a config change reduces module count
        # without touching marketing copy). Path fixed 2026-07-09 — this step was
        # silently dark since the file moved to tests/heavy/ in 3e509e3; "Could not
        # find" isn't a TAP "not ok" line so fail_count read 0 and nothing alerted.
        id: claim_check
        if: always()
        run: |
          node scripts/run-tests.js --timeout 60000 tests/heavy/marketing-claim-verification.test.js 2>&1 \
            | tee .dogfood/claim-check.log || true
          # The runner's own totals: failing tests plus files that never
          # reported a summary (a crash is drift too, not a zero).
          FAIL_COUNT=$(awk '/^# fail /{f=$3} /^# files that did not finish /{u=$NF} END{print f+u+0}' .dogfood/claim-check.log 2>/dev/null || echo 0)
          echo "fail_count=${FAIL_COUNT:-0}" >> "$GITHUB_OUTPUT"

      - name: Open issue if marketing claims drifted
        if: always() && steps.claim_check.outputs.fail_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          FAIL_COUNT="${{ steps.claim_check.outputs.fail_count }}"
          TITLE="Claim drift: $FAIL_COUNT marketing-claim test(s) failed ($(date -u +%Y-%m-%d))"
          BODY=$(printf '## Marketing claim drift detected\n\n%s test(s) in `tests/heavy/marketing-claim-verification.test.js` failed the nightly check.\n\nThis means a public-facing claim (module count, model name, pricing, etc.) no longer matches the shipping code.\n\n**Action:** run `node --test tests/heavy/marketing-claim-verification.test.js` locally, read the failures, then update either the marketing copy or the code to match.\n\nFull log in dogfood artifact for run `%s`.' \
            "$FAIL_COUNT" "${{ github.run_id }}")
          gh issue list --label dogfood,marketing --search "$TITLE in:title" --limit 1 --state open --json title \
            | jq -e 'length == 0' && gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "dogfood,marketing" \
            || echo "issue exists or gh unavailable — skipping"

      - name: Open / update site-stats PR if the numbers changed
        # The continuous loop: last night's self-test produced fresh numbers,
        # this keeps the website's displayed statistics tracking reality.
        #
        # ROLLING BRANCH, NOT A DATED ONE (2026-08-04). This used to cut
        # `flywheel/site-stats-YYYYMMDD` and open a *draft* PR every night.
        # Nothing ever merged them — `main` requires 1 approving review and
        # github-actions[bot] has no bypass allowance, so the bot could
        # neither push to main nor self-merge, and a draft PR cannot be
        # merged at all. Ten identical PRs had piled up by 2026-08-03, each
        # rewriting the same one file, so merging them in sequence would
        # have meant replaying stale numbers over fresh ones.
        #
        # Now: ONE branch, ONE PR, reset onto main each night. site-stats.json
        # is fully regenerated every run, so the newest is always a complete
        # superset — there is nothing to accumulate and resetting loses
        # nothing. Craig reviews one always-current PR instead of a backlog.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Both generated files ride the same rolling PR. precision.json is
          # only rewritten by a fully-passing corpus run, so a red corpus
          # night still ships the site-stats refresh and nothing stale.
          GENERATED="website/app/data/site-stats.json website/app/data/precision.json reliability-corpus/real-world.json website/app/data/changelog.json"
          if git diff --quiet -- $GENERATED; then
            echo "generated site data unchanged — nothing to ship"
            exit 0
          fi
          BRANCH="flywheel/site-stats"
          git config user.name  "gatetest-dogfood[bot]"
          git config user.email "gatetest-dogfood@users.noreply.github.com"

          # Keep the regenerated files across the branch switch, then re-apply
          # them on top of current main so the PR diff is only generated data.
          mkdir -p "$RUNNER_TEMP/generated"
          for f in $GENERATED; do cp "$f" "$RUNNER_TEMP/generated/$(basename "$f")"; done
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          for f in $GENERATED; do cp "$RUNNER_TEMP/generated/$(basename "$f")" "$f"; done

          git add $GENERATED
          if git diff --cached --quiet; then
            echo "already current on main — nothing to ship"
            exit 0
          fi
          git -c commit.gpgsign=false commit -m "chore(stats): refresh website testing statistics $(date -u +%Y-%m-%d)"
          git push -u origin "$BRANCH" --force

          PR_BODY=$(printf 'Nightly self-test refreshed the numbers the website displays.\n\nIf `reliability-corpus/real-world.json` is in this diff, the corpus RATCHETED: a fully-green run lowered a ceiling to what it measured (`--ratchet`, the Fifty move 06). Each lowered ceiling should be named to the fix that earned it before this merges — a drop nobody can explain is a recall hole, not a win.\n\nSource of truth: `website/app/data/site-stats.json` (regenerated by `scripts/generate-site-stats.js` from the real `node --test` sweep + `gatetest --list` + flywheel telemetry). Displayed counts round DOWN — the public "N+" claim is always an under-statement.\n\n`website/app/data/precision.json` (regenerated by `scripts/real-world-precision.js --write-json`) feeds /precision — blocking counts from a full scan of pinned third-party commits. It is only rewritten by a run in which every repo was measured and every ceiling/floor held.\n\nThis is a ROLLING PR — it is reset onto `main` every night, so it always shows current numbers against current `main`. Approve it and auto-merge lands it; it will reopen tomorrow with the next run.')
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Refresh website testing statistics — $(date -u +%Y-%m-%d)" \
            --body "$PR_BODY" \
          || gh pr edit "$BRANCH" \
               --title "Refresh website testing statistics — $(date -u +%Y-%m-%d)" \
               --body "$PR_BODY"

          # Not a draft, and auto-merge armed: the moment the required review
          # lands, so does the PR. A draft can never merge — that was the bug.
          gh pr ready "$BRANCH" || true
          gh pr merge "$BRANCH" --auto --squash || echo "auto-merge unavailable — PR left open for review"
